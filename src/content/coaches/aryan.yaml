bio: >-
  Aryan, or Ari to most of us, grew up in a family of fighters and wrestlers. He started training jiu jitsu and MMA in 2018 under UFC veteran Kamal Shalorus at District Martial Arts. He earned his blue belt at Easton Training Center in Colorado, training under Eliot Marshall and Alex Huddleston, and his purple belt under David Close at UFC Gym in Greenville, South Carolina. His focus is where sport grappling meets real-world self-defense. He also teaches jiu jitsu and combatives to cadets at The Citadel and helps Charleston-area law enforcement officers sharpen their defensive tactics and grappling. Off the mats, Ari is a professional electrical engineer, and it shows in his coaching: he breaks technique down into leverage, body mechanics and efficiency, so it works for you in competition and in real life.

bio: >-
  Sebastian is our resident Youth coach. He teaches kids and adults jiu jitsu and helps with MMA fundamentals. He started jiu jitsu at Gracie Charleston in 2016 and earned his blue belt in 2018, then served four years in the US Marine Corps Infantry, where he began fighting MMA. He came home in 2022, earned his purple belt that July, and earned his brown belt in June 2025. He has trained under Relson Gracie, Mike Key, Pat McGuigan and James Foy, and he is on the mats here most days of the week. He now fights professionally.
teaches: Youth · Adult BJJ · MMA fundamentals
